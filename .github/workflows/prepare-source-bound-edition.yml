name: Prepare source-bound edition repair
on:
  push:
    branches: [maintenance/source-bound-edition]
    paths: ['.github/workflows/prepare-source-bound-edition.yml']
permissions:
  contents: write
concurrency:
  group: rural-update-review-branch-preparation
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Verify exact review base
        run: |
          cp -R maintenance/oct17 "$RUNNER_TEMP/oct17-patch"
          git fetch origin fix/source-bound-edition
          test "$(git rev-parse origin/fix/source-bound-edition)" = 'a86f007e038818bf00b789b7b7715cfb778210cb'
          git checkout -B fix/source-bound-edition origin/fix/source-bound-edition
      - uses: actions/cache/restore@v4
        with:
          path: .release-cache
          key: rural-release-v1-2026-10-17-39052121318-1
      - run: python3 -m pip install --disable-pip-version-check -r requirements-publisher.txt
      - name: Prepare the exact reviewed candidate and preventive changes
        run: |
          python3 "$RUNNER_TEMP/oct17-patch/prepare_review.py"
          python3 "$RUNNER_TEMP/oct17-patch/apply.py"
      - name: Test without generation or publishing credentials
        run: |
          python3 -m unittest discover -s tests -p 'test_release*.py' -v
          python3 -m compileall -q scripts tests
          node --check web/release-runtime.js
          node --check sw.js
          node tests/test_release_sw.cjs
          git diff --check
      - name: Retrieve every cited source before permitting an evidence audit
        run: |
          python3 - <<'PY'
          import json,pathlib,sys
          sys.path.insert(0,'scripts')
          from release_evidence import collect_source_evidence,evidence_urls
          e=json.loads(pathlib.Path('editorial-review/2026-10-17.json').read_text())['candidate']
          docs=collect_source_evidence(e,pathlib.Path('.preflight'))
          assert len(evidence_urls(e,docs))==len(e['sources'])
          print('Read-only live source coverage:',len(docs),'of',len(e['sources']))
          PY
      - name: Save ordinary files only to the review branch
        run: |
          test "$(git branch --show-current)" = 'fix/source-bound-edition'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/release_research.py tests/test_release_staged_research.py tests/test_release_reporting_resume.py tests/test_release_source_catalog.py editorial-review/2026-10-17.json
          git commit -m 'Bind reports to real source catalogs and submit reviewed October 17 edition for audit'
          git fetch origin fix/source-bound-edition
          test "$(git rev-parse origin/fix/source-bound-edition)" = 'a86f007e038818bf00b789b7b7715cfb778210cb'
          git push origin HEAD:refs/heads/fix/source-bound-edition
          git rev-parse HEAD
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: source-bound-edition-preflight
          path: .preflight/source-evidence.json
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7
