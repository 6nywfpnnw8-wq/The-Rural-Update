name: Inspect audio completion mismatch
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/inspect-audio-closure.yml']
permissions:
  contents: read
concurrency:
  group: rural-update-single-publisher
  cancel-in-progress: false
jobs:
  inspect:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/cache/restore@v4
        with:
          path: .release-cache
          key: audio-inspection-only-${{ github.run_id }}
          restore-keys: rural-release-v1-2026-10-26-
      - run: python3 -m pip install --disable-pip-version-check -r requirements-publisher.txt
      - name: Inspect only the two hash-pinned failed public-script passages
        run: |
          python3 - <<'PY'
          import json,sys,shutil
          from pathlib import Path
          sys.path.insert(0,'scripts')
          from release_audio import segments,split_failed_segment,coverage,tokens
          from release_core import podcast_body,digest
          root=Path('.release-cache/2026-10-26'); folder=root/'audio-v2'
          if root.is_symlink() or folder.is_symlink():raise SystemExit('Unsafe cache directory')
          edition=json.loads(Path('editions/2026-10-26.json').read_text())['edition']
          body=podcast_body(edition)
          if digest(body)!='0a5bcda64ca2079df0c7654aa69d38d3442882cde8974088126f8e3edeab40d0':raise SystemExit('Published script identity differs')
          passages=segments(body,max_words=90,max_parts=32,allow_clauses=True)
          pieces=split_failed_segment(passages[14])
          expected=next((p for p in pieces if digest(p)=='3cd64cfc93841555316a482cf2b4f7915bab3837b9daeeaea57f0fcba88b5c28'),None)
          if not expected:raise SystemExit('Published passage identity differs')
          wanted=['a7d6871ef58f568a436e0ad31525f2cc03ed23d2ac333779c8442ab44f0b6dd8','0b0964a1704ba74d584bb2741868cef82388089230f63f9aa456db7fb748587d']
          out=Path('audio-inspection');out.mkdir()
          rows=[]
          for sha in wanted:
              record=folder/('asr-'+sha+'.json')
              if record.is_symlink() or not record.is_file() or record.stat().st_size>100000:raise SystemExit('Unsafe ASR record')
              result=json.loads(record.read_text())
              if result.get('audio_sha256')!=sha or not isinstance(result.get('text'),str):raise SystemExit('ASR identity differs')
              found=[]
              for p in folder.glob('*.wav'):
                  if p.is_symlink() or p.stat().st_size>8000000:continue
                  if digest(p.read_bytes())==sha:found.append(p)
              if len(found)!=1:raise SystemExit('Audio identity differs')
              shutil.copyfile(found[0],out/(sha+'.wav'))
              rows.append({'audio_sha256':sha,'recognized':result['text'],'expected':expected,'comparison':coverage(expected,result['text']),'expected_tokens':tokens(expected),'recognized_tokens':tokens(result['text'])})
          report={'edition_date':'2026-10-26','operation':'hash_pinned_audio_inspection','publication_attempted':False,'cache_modified':False,'paid_api_calls':0,'rows':rows}
          (out/'inspection.json').write_text(json.dumps(report,indent=2)+'\n')
          print(json.dumps({k:v for k,v in report.items() if k!='rows'}))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: audio-closure-inspection-${{ github.run_id }}
          path: audio-inspection/
          retention-days: 1
          if-no-files-found: error
