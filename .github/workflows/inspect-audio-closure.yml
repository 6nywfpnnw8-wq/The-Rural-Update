name: Inspect audio completion mismatch
on:
  workflow_dispatch:
    inputs:
      edition_date:
        description: YYYY-MM-DD; blank inspects today in America/Chicago
        type: string
        required: false
  push:
    branches: [main]
    paths: ['.github/workflows/inspect-audio-closure.yml']
permissions:
  contents: read
concurrency:
  group: rural-update-single-publisher
  cancel-in-progress: false
jobs:
  inspect:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Resolve inspection edition
        id: edition
        env:
          REQUESTED_DATE: ${{ inputs.edition_date }}
        run: |
          python3 - <<'PY'
          import os,re
          from datetime import datetime,date
          from zoneinfo import ZoneInfo
          value=os.environ.get('REQUESTED_DATE') or datetime.now(ZoneInfo('America/Chicago')).date().isoformat()
          if not re.fullmatch(r'\d{4}-\d{2}-\d{2}',value):raise SystemExit('Invalid edition date')
          date.fromisoformat(value)
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:f.write('date='+value+'\n')
          PY
      - uses: actions/cache/restore@v4
        with:
          path: .release-cache
          key: audio-inspection-only-${{ github.run_id }}
          restore-keys: rural-release-v1-${{ steps.edition.outputs.date }}-
      - run: python3 -m pip install --disable-pip-version-check -r requirements-publisher.txt
      - name: Inspect retained failed speech without provider credentials
        run: python3 scripts/release_audio_inspect.py --date '${{ steps.edition.outputs.date }}'
      - uses: actions/upload-artifact@v4
        with:
          name: audio-closure-inspection-${{ github.run_id }}
          path: audio-inspection/
          retention-days: 1
          if-no-files-found: error
