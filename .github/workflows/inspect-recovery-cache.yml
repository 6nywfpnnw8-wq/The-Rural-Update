name: Inspect retained recovery state
on:
  workflow_dispatch:
    inputs:
      edition_date:
        description: Edition date to inspect (YYYY-MM-DD)
        required: false
        type: string
  push:
    branches: [main]
    paths: ['.github/workflows/inspect-recovery-cache.yml', 'recovery-inspection-request.json']
permissions:
  contents: read
jobs:
  inspect:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Resolve requested retained edition
        id: date
        env:
          REQUESTED_EDITION: ${{ inputs.edition_date || '' }}
        run: |
          python3 - <<'PY'
          from datetime import date, datetime
          from pathlib import Path
          from zoneinfo import ZoneInfo
          import json, os
          requested=os.environ.get('REQUESTED_EDITION','').strip()
          request_path=Path('recovery-inspection-request.json')
          if os.environ.get('GITHUB_EVENT_NAME')=='push' and request_path.exists():
              if request_path.is_symlink() or request_path.stat().st_size>4096:
                  raise SystemExit('Unsafe inspection request')
              request=json.loads(request_path.read_text())
              if request.get('operation')!='inspect-retained-recovery' or request.get('publication_authorized') is not False:
                  raise SystemExit('Inspection request cannot authorize publication')
              requested=request.get('edition_date','')
              if not isinstance(requested,str):raise SystemExit('Invalid edition_date')
          today=datetime.now(ZoneInfo('America/Chicago')).date()
          if requested:
              try: value=date.fromisoformat(requested)
              except ValueError: raise SystemExit('Invalid edition_date; use YYYY-MM-DD')
              if value.isoformat()!=requested: raise SystemExit('Invalid edition_date; use YYYY-MM-DD')
          else:
              value=today
          if value>today:raise SystemExit('Cannot inspect a future edition')
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:
              f.write('value='+value.isoformat()+'\n')
          PY
      - uses: actions/cache/restore@v4
        with:
          path: .release-cache
          key: inspection-only-${{ github.run_id }}
          restore-keys: rural-release-v1-${{ steps.date.outputs.value }}-
      - name: Print counters and integrity metadata, never draft text
        env:
          EDITION: ${{ steps.date.outputs.value }}
        run: |
          python3 - <<'PY'
          import hashlib,json,os,re,wave
          from datetime import date as calendar_date
          from pathlib import Path
          date=os.environ['EDITION']
          if not re.fullmatch(r'\d{4}-\d{2}-\d{2}',date):raise SystemExit('Invalid date')
          root=Path('.release-cache')/date
          def read(p):
              if not p.exists():return None
              if p.is_symlink() or p.stat().st_size>2000000:raise SystemExit('Unexpected metadata size or type')
              return json.loads(p.read_text())
          def safe(d,keys):return {k:d.get(k) for k in keys} if isinstance(d,dict) else None
          report={'edition_date':date,'operation':'read_only_recovery_inspection','publication_attempted':False,'paid_api_calls':0,'cache_modified':False}
          report['editorial_attempts']=safe(read(root/'attempts.json'),['attempts'])
          keys=['engine','edition_date','identity','method','section_identity','section','publication_authorized','run_id','observed_section_requests']
          report['markers']={n:safe(read(root/(n+'.json')),keys) for n in ['corrective-generation-used','narration-limit-resume-used','narration-capacity-resume-used','narration-prose-resume-used']}
          folder=root/'staged-research-v3'
          report['stages']={}
          for n in ['discovery','sources','reporting','narration']:
              p=folder/(n+'.json');d=read(p)
              report['stages'][n]={'exists':p.exists(),'metadata':safe(d,['engine','identity','sha256','publication_authorized']),'file_sha256':hashlib.sha256(p.read_bytes()).hexdigest() if p.exists() else None}
          report['audit_files_present']=[n for n in ['audit.json','audit-bound.json','approved.json'] if (root/n).exists()]
          report['editorial_review_slots']={}
          editorial=root/'editorial-loop-v1'
          for slot in ('initial','final'):
              result_path=editorial/(slot+'-result.json')
              reserved_path=editorial/(slot+'-reserved.json')
              result=read(result_path) or {};reserved=read(reserved_path) or {}
              value=result.get('value') if isinstance(result,dict) else None
              report['editorial_review_slots'][slot]={
                  'reserved':reserved_path.exists(),
                  'run_id':reserved.get('run_id'),
                  'publication_authorized':reserved.get('publication_authorized'),
                  'result_present':result_path.exists(),
                  'review_complete':value.get('review_complete') if isinstance(value,dict) else None,
                  'finding_count':len(value.get('findings',[])) if isinstance(value,dict) and isinstance(value.get('findings'),list) else None,
                  'result_file_sha256':hashlib.sha256(result_path.read_bytes()).hexdigest() if result_path.exists() else None,
                  'saved_value_sha256':result.get('value_sha256')}
          report['section_ledgers']=[]
          labels=[f'{n}-{i}' for n,i in [('opening',None),('bluf',None),('developments',0),('developments',1),('developments',2),('oklahoma',None),('signals',None),('actions',None),('deadlines',None),('closing',None)]]
          for p in (folder/'sectioned-narration-v1').glob('*/attempts.json'):
              d=read(p);row={'identity':d.get('identity'),'requests':d.get('requests'),'attempts':{k:d.get('attempts',{}).get(k,0) for k in labels},'publication_authorized':d.get('publication_authorized'),'completed_sections':[]}
              for label in labels:
                  q=p.parent/(label+'.json');v=read(q)
                  if v is not None:row['completed_sections'].append({'section':label,'identity_matches':v.get('identity')==d.get('identity'),'file_sha256':hashlib.sha256(q.read_bytes()).hexdigest()})
              report['section_ledgers'].append(row)
          responses=read(root/'api-responses.json') or {}
          report['last_api_response']=safe((responses.get('responses') or [{}])[-1],['stage','status','incomplete_reason','requested_output_limit','run_id','visible_characters'])
          failure=read(root/'validation-content.json') or {}
          snap=failure.get('snapshot') or {}
          if failure.get('rule')=='deadline_window' and failure.get('edition_date')==date:
              sha=snap.get('candidate_sha256','')
              if not re.fullmatch(r'[a-f0-9]{64}',sha):raise SystemExit('Invalid candidate hash')
              if root.is_symlink() or (root/'candidates').is_symlink():raise SystemExit('Unsafe candidate directory')
              saved=read(root/'candidates'/('content-'+sha[:16]+'.json')) or {}
              candidate=saved.get('candidate')
              actual=hashlib.sha256(json.dumps(candidate,sort_keys=True,ensure_ascii=False).encode()).hexdigest()
              if actual!=sha or saved.get('candidate_sha256')!=sha or saved.get('redacted') is not False:
                  raise SystemExit('Candidate integrity differs')
              if candidate.get('edition_date')!=date or saved.get('publication_authorized') is not False:
                  raise SystemExit('Candidate state differs')
              rows=[]
              for i,item in enumerate(candidate.get('deadlines',[])):
                  value=item.get('date','')
                  if not re.fullmatch(r'\d{4}-\d{2}-\d{2}',value):raise SystemExit('Invalid candidate date')
                  delta=(calendar_date.fromisoformat(value)-calendar_date.fromisoformat(date)).days
                  rows.append({'path':'/deadlines/'+str(i),'date':value,'days_from_edition':delta,'within_window':0<=delta<=30})
              report['deadline_window']={'candidate_sha256':sha,'failed_run_id':failure.get('run_id'),'dates':rows}
          audio=root/'audio-v2/assembled.wav'
          report['audio_assembly']={'exists':audio.exists()}
          if audio.exists():
              if audio.is_symlink() or (root/'audio-v2').is_symlink() or audio.stat().st_size>268435456:
                  raise SystemExit('Unsafe assembled audio')
              with wave.open(str(audio),'rb') as f:
                  report['audio_assembly'].update(frames=f.getnframes(),sample_rate=f.getframerate(),channels=f.getnchannels(),sample_width=f.getsampwidth(),duration_seconds=f.getnframes()/f.getframerate())
          quality=read(root/'audio-quality-progress.json') or {}
          report['audio_progress']=safe(quality,['normalization_version','source_parts','accepted_leaf_parts','maximum_split_depth','complete'])
          rows=quality.get('parts',[])
          report['accepted_word_end']=max((r.get('end_word',0) for r in rows if r.get('passed') is True),default=0)
          report['speech_request_count']=sum((read(p) or {}).get('attempts',0) for p in (root/'audio-v2').glob('*-attempts.json'))
          Path('recovery-inspection.json').write_text(json.dumps(report,indent=2)+'\n')
          print(json.dumps(report,indent=2))
          # Export only screened, date-scoped public-source working material.
          # This inspection has no provider credentials and never writes the cache.
          import sys,zipfile
          sys.path.insert(0,'scripts')
          from release_diagnostics import redact
          files=[root/n for n in ('attempts.json','api-responses.json',
              'narration-structural-resume-used.json','narration-structural-followup-used.json')]
          files.extend(folder/(n+'.json') for n in ('discovery','sources','reporting'))
          files.extend((folder/'evidence-coverage-v2').glob('*.json'))
          files.append(root/'app-pdf-evidence-recovery-v1-used.json')
          files.extend((root/'app-pdf-evidence-recovery-v1').glob('**/*.json'))
          files.append(root/'coverage-source-evidence.json')
          files.append(root/'coverage-plan-repair-authorized.json')
          files.extend(root.glob('coverage-plan-repair-used*.json'))
          files.extend(root.glob('validation-*.json'))
          files.append(root/'editorial-recovery-attempt.json')
          files.append(root/'retained-bluf-recovery-used.json')
          files.append(root/'retained-discovery-continuation-used.json')
          files.extend((root/'editorial-loop-v1').glob('*.json'))
          files.extend((root/'candidates').glob('*.json'))
          files.extend((root/'stage-responses').glob('*.json'))
          files.append(root/'source-text-cache.json')
          files.append(root/'audit-protocol-recovery-used.json')
          files.append(root/'reviewed-incomplete-app-v1-used.json')
          files.extend((root/'section-candidates').glob('*.json'))
          files.extend((folder/'sectioned-narration-v1').glob('*/*.json'))
          inventory=[];total=0
          with zipfile.ZipFile('retained-recovery-state.zip','w',zipfile.ZIP_DEFLATED) as archive:
              for p in sorted(set(files)):
                  if not p.exists():continue
                  if p.is_symlink() or any(q.is_symlink() for q in p.parents):
                      raise SystemExit('Unsafe retained-state path')
                  p.resolve().relative_to(root.resolve())
                  value=read(p)
                  if redact(value)!=value:raise SystemExit('Retained state failed credential screening')
                  data=p.read_bytes();total+=len(data)
                  if total>10000000:raise SystemExit('Retained-state export exceeds size limit')
                  archive.writestr(p.as_posix(),data)
                  inventory.append({'path':p.as_posix(),'sha256':hashlib.sha256(data).hexdigest()})
              archive.writestr('inventory.json',json.dumps({'edition_date':date,
                  'paid_api_calls':0,'cache_modified':False,'files':inventory},indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: recovery-inspection-${{ github.run_id }}
          path: |
            recovery-inspection.json
            retained-recovery-state.zip
          retention-days: 7

