name: Check public reference availability
on:
  push:
    branches: [fix/review-retained-signal-evidence]
    paths: ['.github/workflows/check-reference-availability.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check the three cited public pages without model calls
        run: |
          python3 - <<'PY'
          import json,hashlib,pathlib,urllib.request,urllib.parse,datetime
          urls=[
          'https://www.cms.gov/fqhc-rhc-news-announcements',
          'https://www.hhs.gov/guidance/document/proposed-rule-medicaid-program-amending-indirect-hold-harmless-threshold-health-care',
          'https://www.cms.gov/medicare/payment/fee-schedules/physician/federal-regulation-notices/cms-1848-p']
          def allowed(url):
              u=urllib.parse.urlsplit(url)
              return u.scheme=='https' and u.hostname in ('www.cms.gov','www.hhs.gov')
          class Redirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self,req,fp,code,msg,headers,newurl):
                  if not allowed(newurl): raise ValueError('Redirect outside source hosts')
                  return super().redirect_request(req,fp,code,msg,headers,newurl)
          opener=urllib.request.build_opener(Redirect())
          results=[]
          for url in urls:
              try:
                  with opener.open(urllib.request.Request(url,headers={'User-Agent':'TheRuralUpdate-EvidenceCheck/1.0'}),timeout=30) as r:
                      data=r.read(5*1024*1024+1)
                      results.append({'url':url,'status':r.status,'final_url':r.geturl(),'content_type':r.headers.get_content_type(),'bytes':len(data),'sha256':hashlib.sha256(data).hexdigest()})
              except Exception as exc:
                  results.append({'url':url,'error':str(exc)})
          pathlib.Path('reference-availability.json').write_text(json.dumps(results,indent=2))
          print(json.dumps(results,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: reference-availability
          path: reference-availability.json
          retention-days: 1
