name: Rural Update reliability tests
on:
  pull_request:
  push:
    branches: [main]
    paths: ['scripts/release_*.py', 'tests/**', 'web/**', 'sw.js', '.github/workflows/**']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m pip install --disable-pip-version-check -r requirements-publisher.txt
      - run: python3 -m unittest discover -s tests -p 'test_release*.py' -v
      - run: node --check web/release-runtime.js && node --check sw.js && node tests/test_release_sw.cjs
