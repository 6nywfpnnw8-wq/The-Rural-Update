name: Inspect rejected edition for editorial correction
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/inspect-audit-candidate.yml']
permissions:
  contents: read
concurrency:
  group: rural-update-single-publisher
  cancel-in-progress: false
jobs:
  inspect:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/cache/restore@v4
        with:
          path: .release-cache
          key: audit-inspection-only-${{ github.run_id }}
          restore-keys: rural-release-v1-2026-10-22-
      - name: Inspect the hash-pinned corrected candidate and incomplete follow-up review
        run: |
          python3 - <<'PY'
          import hashlib,json,re
          from pathlib import Path
          root=Path('.release-cache/2026-10-22')
          sha='e1e0643f5f69b39bd09b9c034119b5e05161d3770f2df9f610f87fb095e2b821'
          def fingerprint(value):
              return hashlib.sha256(json.dumps(value,sort_keys=True,ensure_ascii=False).encode()).hexdigest()
          def read(p):
              if p.is_symlink() or not p.is_file() or p.stat().st_size>2097152:
                  raise SystemExit('Expected retained diagnostic is missing or unsafe')
              value=json.loads(p.read_text())
              raw=json.dumps(value,ensure_ascii=False)
              if re.search(r'(?:sk-(?:proj-|svcacct-)?[A-Za-z0-9_-]{16,}|github_pat_[A-Za-z0-9_]{16,}|gh[pousr]_[A-Za-z0-9]{16,}|-----BEGIN .*PRIVATE KEY)',raw):
                  raise SystemExit('Potential credential pattern; export refused')
              return value
          folder=root/'editorial-loop-v1'
          if root.is_symlink() or (root/'candidates').is_symlink() or folder.is_symlink():
              raise SystemExit('Unsafe diagnostic directory')
          snapshot=read(root/'candidates'/('editorial-corrected-'+sha[:16]+'.json'))
          candidate=snapshot.get('candidate')
          correction=read(root/'validation-editorial-correction.json')
          if fingerprint(candidate)!=sha or snapshot.get('candidate_sha256')!=sha or correction.get('candidate_sha256')!=sha:
              raise SystemExit('Corrected candidate identity differs')
          if candidate.get('edition_date')!='2026-10-22' or snapshot.get('publication_authorized') is not False or snapshot.get('redacted') is not False:
              raise SystemExit('Invalid candidate state')
          slot='reference-corrected-final'
          result=read(folder/(slot+'-result.json'))
          reservation=read(folder/(slot+'-reserved.json'))
          review=result.get('value')
          if result.get('value_sha256')!=fingerprint(review) or result.get('payload_sha256')!=reservation.get('payload_sha256'):
              raise SystemExit('Saved review integrity differs')
          if review.get('review_complete') is not False:
              raise SystemExit('Expected incomplete follow-up review is absent')
          out=Path('editorial-inspection');out.mkdir()
          (out/'candidate.json').write_text(json.dumps(candidate,ensure_ascii=False,indent=2)+'\n')
          (out/'followup-review.json').write_text(json.dumps(review,ensure_ascii=False,indent=2)+'\n')
          metadata={'edition_date':'2026-10-22','candidate_sha256':sha,'review_sha256':fingerprint(review),'review_complete':False,'finding_count':len(review.get('findings',[])),'slot':slot,'publication_attempted':False,'cache_modified':False,'paid_api_calls':0,'publication_authorized':False}
          (out/'inspection.json').write_text(json.dumps(metadata,indent=2)+'\n')
          print(json.dumps(metadata))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: editorial-inspection-${{ github.run_id }}
          path: editorial-inspection/
          retention-days: 1
          if-no-files-found: error
