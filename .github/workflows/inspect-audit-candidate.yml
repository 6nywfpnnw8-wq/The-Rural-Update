name: Inspect rejected edition for editorial correction
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/inspect-audit-candidate.yml']
permissions:
  contents: read
concurrency:
  group: rural-update-single-publisher
  cancel-in-progress: false
jobs:
  inspect:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/cache/restore@v4
        with:
          path: .release-cache
          key: audit-inspection-only-${{ github.run_id }}
          restore-keys: rural-release-v1-2026-10-21-
      - name: Inspect the exact retained candidate and completed final review
        run: |
          python3 - <<'PY'
          import hashlib,json,re,subprocess,zipfile
          from pathlib import Path
          root=Path('.release-cache/2026-10-21')
          sha='184496d3daed1e6e6c426d6dbaa1395bb1ea4e55adb4ef17d6a878feaa885003'
          def fingerprint(value):
              return hashlib.sha256(json.dumps(value,sort_keys=True,ensure_ascii=False).encode()).hexdigest()
          def read(p):
              if p.is_symlink() or not p.is_file() or p.stat().st_size>2097152:
                  raise SystemExit('Expected retained diagnostic is missing or unsafe')
              value=json.loads(p.read_text())
              raw=json.dumps(value,ensure_ascii=False)
              if re.search(r'(?:sk-(?:proj-|svcacct-)?[A-Za-z0-9_-]{16,}|github_pat_[A-Za-z0-9_]{16,}|gh[pousr]_[A-Za-z0-9]{16,}|-----BEGIN .*PRIVATE KEY)',raw):
                  raise SystemExit('Potential credential pattern; export refused')
              return value
          if root.is_symlink() or (root/'candidates').is_symlink() or (root/'editorial-loop-v1').is_symlink():
              raise SystemExit('Unsafe diagnostic directory')
          snapshot=read(root/'candidates'/('editorial-corrected-'+sha[:16]+'.json'))
          candidate=snapshot.get('candidate')
          if fingerprint(candidate)!=sha or snapshot.get('candidate_sha256')!=sha or snapshot.get('redacted') is not False:
              raise SystemExit('Candidate identity or redaction state differs')
          if candidate.get('edition_date')!='2026-10-21' or snapshot.get('publication_authorized') is not False:
              raise SystemExit('Invalid candidate state')
          completed=read(root/'editorial-loop-v1/final-result.json')
          review=completed.get('value')
          if completed.get('value_sha256')!=fingerprint(review):
              raise SystemExit('Final review integrity mismatch')
          failure=read(Path('.release-cache/failure.json'))
          if failure.get('error')!='Audit finding does not quote the named candidate field':
              raise SystemExit('Expected quotation-binding failure is absent')
          rows=[]
          for finding in review.get('findings',[]):
              path=finding.get('path','')
              if not re.fullmatch(r'/(?:bluf|title|podcast/(?:opening|bluf|oklahoma|signals|actions|deadlines|closing|developments/[012])|(?:stories|signals|actions|deadlines|issue_updates)/[0-9]+/[A-Za-z_]+)',path):
                  raise SystemExit('Unexpected finding field path')
              field=candidate
              for part in path.split('/')[1:]:
                  field=field[int(part)] if isinstance(field,list) else field[part]
              quote=finding.get('quote','')
              rows.append({'id':finding.get('id'),'path':path,'kind':finding.get('kind'),
                           'exact_match':bool(quote.strip()) and quote in field,
                           'whitespace_only_match':' '.join(quote.split()) in ' '.join(field.split()),
                           'quote_sha256':fingerprint(quote),'field_sha256':fingerprint(field)})
          out=Path('editorial-inspection');out.mkdir()
          (out/'candidate.json').write_text(json.dumps(candidate,ensure_ascii=False,indent=2)+'\n')
          (out/'final-review.json').write_text(json.dumps(review,ensure_ascii=False,indent=2)+'\n')
          metadata={'edition_date':'2026-10-21','candidate_sha256':sha,'review_sha256':fingerprint(review),'checks':rows,'publication_attempted':False,'cache_modified':False,'paid_api_calls':0}
          (out/'inspection.json').write_text(json.dumps(metadata,indent=2)+'\n')
          prefixes=('scripts/','tests/','ops/','.github/workflows/','archive/','data/','icons/','web/','source-recovery/','editorial-review/','repair-authorizations/')
          names={'requirements-publisher.txt','index.html','manifest.webmanifest','intelligence.js','signals-reference.js','sw.js'}
          tracked=subprocess.check_output(['git','ls-files','-z']).decode().split('\0')
          with zipfile.ZipFile(out/'repository-test-files.zip','w',zipfile.ZIP_DEFLATED) as z:
              for name in tracked:
                  if not name or not (name in names or name.startswith(prefixes)):continue
                  q=Path(name)
                  if q.is_symlink() or not q.is_file() or q.stat().st_size>3000000:continue
                  z.write(q,name)
          print(json.dumps(metadata))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: editorial-inspection-${{ github.run_id }}
          path: editorial-inspection/
          retention-days: 1
          if-no-files-found: error
