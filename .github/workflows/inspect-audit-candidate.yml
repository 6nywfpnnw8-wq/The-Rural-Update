name: Inspect rejected edition for editorial correction
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/inspect-audit-candidate.yml']
permissions:
  contents: read
concurrency:
  group: rural-update-single-publisher
  cancel-in-progress: false
jobs:
  inspect:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/cache/restore@v4
        with:
          path: .release-cache
          key: audit-inspection-only-${{ github.run_id }}
          restore-keys: rural-release-v1-2026-10-22-
      - name: Inspect the exact retained candidate and incomplete initial review
        run: |
          python3 - <<'PY'
          import hashlib,json,re
          from pathlib import Path
          root=Path('.release-cache/2026-10-22')
          sha='b4ea9702ca2077eac59747f840c61b691f83240e5c78ff91be8399ea1985a4e6'
          def fingerprint(value):
              return hashlib.sha256(json.dumps(value,sort_keys=True,ensure_ascii=False).encode()).hexdigest()
          def read(p):
              if p.is_symlink() or not p.is_file() or p.stat().st_size>2097152:
                  raise SystemExit('Expected retained diagnostic is missing or unsafe')
              value=json.loads(p.read_text())
              raw=json.dumps(value,ensure_ascii=False)
              if re.search(r'(?:sk-(?:proj-|svcacct-)?[A-Za-z0-9_-]{16,}|github_pat_[A-Za-z0-9_]{16,}|gh[pousr]_[A-Za-z0-9]{16,}|-----BEGIN .*PRIVATE KEY)',raw):
                  raise SystemExit('Potential credential pattern; export refused')
              return value
          folder=root/'editorial-loop-v1'
          if root.is_symlink() or (root/'candidates').is_symlink() or folder.is_symlink():
              raise SystemExit('Unsafe diagnostic directory')
          original=read(folder/'original.json')
          candidate=original.get('candidate')
          if fingerprint(candidate)!=sha or original.get('candidate_sha256')!=sha:
              raise SystemExit('Candidate identity differs')
          if candidate.get('edition_date')!='2026-10-22' or original.get('publication_authorized') is not False:
              raise SystemExit('Invalid candidate state')
          result=read(folder/'initial-result.json')
          reservation=read(folder/'initial-reserved.json')
          review=result.get('value')
          if result.get('value_sha256')!=fingerprint(review) or result.get('payload_sha256')!=reservation.get('payload_sha256'):
              raise SystemExit('Saved review integrity differs')
          if review.get('review_complete') is not False:
              raise SystemExit('Expected incomplete review is absent')
          out=Path('editorial-inspection');out.mkdir()
          (out/'candidate.json').write_text(json.dumps(candidate,ensure_ascii=False,indent=2)+'\n')
          (out/'initial-review.json').write_text(json.dumps(review,ensure_ascii=False,indent=2)+'\n')
          metadata={'edition_date':'2026-10-22','candidate_sha256':sha,'review_sha256':fingerprint(review),'review_complete':False,'finding_count':len(review.get('findings',[])),'correction_reserved':(folder/'correction-reserved.json').exists(),'final_review_reserved':(folder/'final-reserved.json').exists(),'publication_attempted':False,'cache_modified':False,'paid_api_calls':0,'publication_authorized':False}
          (out/'inspection.json').write_text(json.dumps(metadata,indent=2)+'\n')
          print(json.dumps(metadata))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: editorial-inspection-${{ github.run_id }}
          path: editorial-inspection/
          retention-days: 1
          if-no-files-found: error
