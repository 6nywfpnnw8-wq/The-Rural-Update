name: Check exact public source content
on:
  pull_request:
    paths: ['scripts/release_evidence.py', 'scripts/release_retained_app.py', 'source-recovery/**', 'app-evidence-recovery/**', '.github/workflows/check-exact-source-content.yml']
permissions:
  contents: read
jobs:
  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: python3 -m pip install --disable-pip-version-check -r requirements-publisher.txt
      - name: Retrieve all exact references without model calls or publication
        run: |
          python3 - <<'PY'
          import copy,json,pathlib,sys
          sys.path.insert(0,'scripts')
          from release_core import read_json,validate_edition
          from release_evidence import collect_source_evidence,evidence_urls,fingerprint
          e=copy.deepcopy(read_json(pathlib.Path('editorial-review/2026-10-14.json'))['candidate'])
          correction=read_json(pathlib.Path('source-recovery/2026-10-14.json'))
          assert fingerprint(e)==correction['previous_candidate_sha256']
          next(s for s in e['sources'] if s['id']==correction['source_id']).update(correction['replacement'])
          assert fingerprint(e)==correction['corrected_candidate_sha256']
          validate_edition(e,e['edition_date'])
          cache=pathlib.Path('.release-cache/source-preflight')
          documents=collect_source_evidence(e,cache)
          urls=evidence_urls(e,documents)
          print(json.dumps({'exact_sources_retrieved':len(urls),'publication_authorized':False,'model_calls':0}))
          PY
      - name: Verify the retained CMS and Federal Register PDF references
        run: |
          python3 - <<'PY'
          import json,pathlib,sys
          sys.path.insert(0,'scripts')
          from release_evidence import fetch_source
          sources=[
              ('cms-mln-mm14468','https://www.cms.gov/files/document/mm14468-rural-health-clinics-federally-qualified-health-centers-billing-distant-site-telehealth.pdf'),
              ('provider-tax-nprm','https://www.govinfo.gov/content/pkg/FR-2026-07-23/pdf/2026-14897.pdf')]
          documents=[]
          for source_id,url in sources:
              document=fetch_source(url);document['source_id']=source_id
              assert document['content_type']=='application/pdf'
              assert document['extraction']['page_count']>0
              documents.append(document)
          output=pathlib.Path('.release-cache/source-preflight/pdf-evidence.json')
          output.parent.mkdir(parents=True,exist_ok=True)
          output.write_text(json.dumps({'documents':documents,'model_calls':0,'publication_authorized':False},indent=2)+'\n')
          print(json.dumps({'verified_pdf_sources':len(documents),'model_calls':0,'publication_authorized':False}))
          PY
      - name: Verify the reviewed November 3 completion sources without generation
        run: |
          python3 - <<'PY'
          import json,pathlib,sys
          sys.path.insert(0,'scripts')
          from release_core import read_json,write_json
          from release_source_selection import compile_selection
          from release_research import validate_source_catalog
          from release_coverage_plan import validate_documents
          from release_evidence import fetch_source
          from release_retained_app import matches_reviewed_source
          path=pathlib.Path('app-evidence-recovery/2026-11-03.json')
          if not path.exists():raise SystemExit(0)
          policy=read_json(path)
          if policy['method']!='app-evidence-completion-v2':raise SystemExit(0)
          fixture=read_json(pathlib.Path('tests/fixtures/source-coverage-2026-11-03.json'))
          catalogs=[compile_selection(s['output_text'],fixture['observed_urls']) for s in fixture['selections']]
          catalog=next(c for c in catalogs if len(c)==9)
          additions={s['id']:s for s in policy['added_sources']}
          catalog += [{k:s[k] for k in ('id','title','url','published_date')} for s in additions.values()]
          validate_source_catalog(catalog,fixture['observed_urls'])
          documents=[];mismatches=[]
          for source in catalog:
              d=fetch_source(source['url']);d['source_id']=source['id']
              if source['id'] in additions:
                  s=additions[source['id']]
                  keys=('sha256','text_sha256','content_type')
                  if not matches_reviewed_source(d,s):
                      mismatches.append({'source_id':source['id'],
                          'expected':{k:s[k] for k in (*keys,'accepted_sha256')},'observed':{k:d[k] for k in keys}})
              documents.append(d)
          validate_documents(documents,catalog)
          write_json(pathlib.Path('.release-cache/source-preflight/completion-evidence.json'),{
              'sources':[{k:v for k,v in d.items() if k!='text'} for d in documents],
              'added_source_documents':[d for d in documents if d['source_id'] in additions],
              'mismatches':mismatches,
              'model_calls':0,'publication_authorized':False})
          print(json.dumps({'completion_sources_retrieved':len(documents),
              'combined_characters':sum(len(d['text']) for d in documents),
              'model_calls':0,'publication_authorized':False}))
          if mismatches:
              print(json.dumps({'mismatches':mismatches}))
              raise SystemExit('Reviewed completion source changed; retained exact source diagnostics')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: exact-source-preflight
          path: .release-cache/source-preflight/*.json
          include-hidden-files: true
          retention-days: 1
          if-no-files-found: ignore

