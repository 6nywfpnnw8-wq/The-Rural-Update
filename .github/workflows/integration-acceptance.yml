name: Rural Update integration acceptance
run-name: App integration acceptance
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['integration-request.json']
permissions:
  contents: read
concurrency:
  group: rural-update-single-publisher
  cancel-in-progress: false
jobs:
  acceptance:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify app generation, editorial gates, and delivery offline
        run: |
          python3 -m pip install --disable-pip-version-check -r requirements-publisher.txt
          python3 -m unittest discover -s tests -p 'test_release_app_only.py' -v
          node --check web/release-runtime.js
          node --check sw.js
          node tests/test_release_sw.cjs
