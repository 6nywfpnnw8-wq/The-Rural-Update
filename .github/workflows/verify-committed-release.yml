name: Read-only October 14 public delivery verification
on:
  push:
    branches: [verify/oct14-public-delivery]
    paths: ['.github/workflows/verify-committed-release.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 7c698e062690a67efeaefc745d998b074167f4db
          persist-credentials: false
      - run: python3 -m pip install --disable-pip-version-check -r requirements-publisher.txt
      - name: Install audio verification dependency
        run: |
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq ffmpeg
          fi
      - name: Read public artifacts and compare with the committed manifest
        run: python3 scripts/release_verify.py verify --date 2026-10-14 --expected release.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: independent-public-delivery-check
          path: .release-cache/delivery-report.json
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: ignore
