name: Read-only schedule diagnostic
# Temporary diagnostic, not a publisher. No checkout, secrets, writes or API calls.
on:
  schedule:
    - cron: '5,15 16 14 10 *'
permissions: {}
jobs:
  observe:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Record a genuine clock-triggered event
        env:
          EVENT_NAME: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          python3 - <<'PY'
          import datetime,json,os
          from zoneinfo import ZoneInfo
          now=datetime.datetime.now(datetime.timezone.utc)
          if now.date().isoformat()!='2026-10-14':
              print('Diagnostic window expired; no action.')
          else:
              assert os.environ['EVENT_NAME']=='schedule'
              print(json.dumps({'event':'schedule','schedule':os.environ['SCHEDULE'],'utc':now.isoformat(),'central':now.astimezone(ZoneInfo('America/Chicago')).isoformat(),'publication_performed':False}))
          PY
