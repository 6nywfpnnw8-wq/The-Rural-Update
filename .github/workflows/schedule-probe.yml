name: Observe actual scheduled triggers
# Diagnostic only. No API generation, recovery dispatch, credentials or deployment.
on:
  schedule:
    - cron: '27,37,47 14 14 10 *'
    - cron: '28,38,48 9 14 10 *'
      timezone: America/Chicago
  push:
    branches: [main]
    paths: ['.github/workflows/schedule-probe.yml']
permissions:
  contents: read
jobs:
  observe:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Record actual event type and time
        env:
          TRIGGER: ${{ github.event_name }}
          CRON: ${{ github.event.schedule }}
        run: |
          python3 - <<'PY'
          import datetime, json, os
          now=datetime.datetime.now(datetime.timezone.utc)
          active=now.date().isoformat()=='2026-10-14'
          print(json.dumps({'active_probe_date':active,'event':os.environ['TRIGGER'],
                            'cron':os.environ['CRON'],'observed_at':now.isoformat(),
                            'scheduled_trigger_observed':active and os.environ['TRIGGER']=='schedule',
                            'publication_attempted':False},indent=2))
          PY
