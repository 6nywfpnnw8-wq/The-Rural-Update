name: Review retained signal evidence
on:
  push:
    branches: [fix/review-retained-signal-evidence]
    paths: ['.github/workflows/review-retained-evidence.yml']
permissions:
  contents: read
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/cache/restore@v4
        with:
          path: .release-cache
          key: rural-release-v1-2026-10-14-evidence-review-${{ github.run_id }}
          restore-keys: rural-release-v1-2026-10-14-
      - run: python3 -m pip install --disable-pip-version-check -r requirements-publisher.txt
      - name: Collect identified public-source draft for editorial review only
        run: |
          python3 - <<'PY'
          import json, pathlib, sys
          sys.path.insert(0, 'scripts')
          from release_resume import _read_snapshot
          cache=pathlib.Path('.release-cache/2026-10-14')
          out=pathlib.Path('evidence-review'); out.mkdir()
          name='content-caf95742a2577efb.json'
          record=_read_snapshot(cache/'candidates'/name,'2026-10-14','content')
          if not record: raise SystemExit('Identified snapshot unavailable or integrity check failed')
          (out/'unapproved-public-draft.json').write_text(json.dumps(record,indent=2))
          # Retain the original public retrieval record for comparison, never treat it as approval.
          facts={k:v for k,v in record['candidate'].items() if k!='podcast'}
          for path in sorted((cache/'candidates').glob('generated-*.json')):
              original=_read_snapshot(path,'2026-10-14','generated')
              if original and {k:v for k,v in original['candidate'].items() if k!='podcast'}==facts:
                  (out/'original-public-retrieval.json').write_text(json.dumps(original,indent=2))
                  break
          print('Identified unapproved public-source draft collected for review. No publication or API calls.')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: retained-public-draft-editorial-review
          path: evidence-review
          retention-days: 1
