name: Check publisher API access
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: rural-update-single-publisher
  cancel-in-progress: false
jobs:
  credential-check:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: github-pages
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Run offline credential-check tests
        run: |
          python3 -m py_compile ops/check_openai_access.py
          python3 -m unittest discover -s tests -p 'test_release_credentials.py' -v
      - name: Verify production app research and web-search access
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          RURAL_UPDATE_MODEL: ${{ vars.RURAL_UPDATE_MODEL || 'gpt-5-mini' }}
        run: python3 ops/check_openai_access.py
      - name: Preserve sanitized capability results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: credential-check-${{ github.run_id }}-${{ github.run_attempt }}
          path: credential-check-report.json
          if-no-files-found: ignore
          retention-days: 7

