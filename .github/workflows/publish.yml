name: Publish validated Rural Update
run-name: "Publish validated Rural Update / mode=${{ inputs.mode || 'publish' }} / date=${{ inputs.edition_date || 'auto' }}"
on:
  workflow_dispatch:
    inputs:
      mode:
        description: Publish/recover today, verify delivery, test alerts, or inspect cached diagnostics
        type: choice
        options: [publish, recover, verify, test-alert, diagnose]
        default: publish
      edition_date:
        description: YYYY-MM-DD; blank resolves to today in America/Chicago
        type: string
        required: false
  push:
    branches: [main]
    paths:
      - 'release-request.json'
permissions:
  contents: read
concurrency:
  group: rural-update-single-publisher
  cancel-in-progress: false
jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    permissions:
      contents: write
      pages: write
      id-token: write
      issues: write
    env:
      MODE: ${{ inputs.mode || 'publish' }}
      REQUESTED_DATE: ${{ inputs.edition_date }}
      RURAL_UPDATE_MODEL: ${{ vars.RURAL_UPDATE_MODEL || 'gpt-5-mini' }}
      PAGES_ARTIFACT_NAME: rural-update-pages-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Resolve edition
        id: edition
        run: |
          python3 - <<'PY'
          import datetime, os, re
          from zoneinfo import ZoneInfo
          d=os.environ.get('REQUESTED_DATE') or datetime.datetime.now(ZoneInfo('America/Chicago')).date().isoformat()
          if not re.fullmatch(r'\d{4}-\d{2}-\d{2}', d): raise SystemExit('Invalid edition date')
          datetime.date.fromisoformat(d)
          with open(os.environ['GITHUB_OUTPUT'],'a') as f: f.write('date='+d+'\n')
          PY
      - name: Restore resumable source and reporting work
        if: env.MODE == 'publish' || env.MODE == 'recover' || env.MODE == 'diagnose'
        uses: actions/cache/restore@v4
        with:
          path: .release-cache
          key: rural-release-v1-${{ steps.edition.outputs.date }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: rural-release-v1-${{ steps.edition.outputs.date }}-
      - name: Install deterministic compiler dependencies
        run: python3 -m pip install --disable-pip-version-check -r requirements-publisher.txt
      - name: Test publishing controls before accessing credentials
        run: |
          python3 -m unittest discover -s tests -p 'test_release*.py' -v
          node --check web/release-runtime.js
          node --check sw.js
          node tests/test_release_sw.cjs
      - name: Check provider readiness before reserving an editorial attempt
        id: provider_access
        if: env.MODE == 'publish' || env.MODE == 'recover'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python3 ops/publisher_provider_check.py --date '${{ steps.edition.outputs.date }}'
      - name: Inspect cached diagnostics without generation or publication
        if: env.MODE == 'diagnose'
        run: python3 scripts/release_pipeline.py --date '${{ steps.edition.outputs.date }}' --diagnose-cached
      - name: Prepare and atomically save validated release
        id: prepare
        if: (env.MODE == 'publish' || env.MODE == 'recover') && steps.provider_access.outcome == 'success'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          RURAL_UPDATE_STRUCTURED_REVIEW: 'true'
        run: python3 scripts/release_pipeline.py --date '${{ steps.edition.outputs.date }}' --commit
      - name: Diagnose blocked recovery without generation
        if: always() && steps.prepare.outcome == 'failure' && (env.MODE == 'publish' || env.MODE == 'recover')
        run: python3 scripts/release_pipeline.py --date '${{ steps.edition.outputs.date }}' --diagnose-cached
      - name: Configure Pages
        if: steps.prepare.outcome == 'success'
        uses: actions/configure-pages@v5
      - name: Upload exactly the validated site, never the repository root
        if: steps.prepare.outcome == 'success'
        uses: actions/upload-pages-artifact@v3
        with:
          path: .site
          name: ${{ env.PAGES_ARTIFACT_NAME }}
      - name: Deploy validated snapshot
        id: deploy
        if: steps.prepare.outcome == 'success'
        uses: actions/deploy-pages@v4
        with:
          artifact_name: ${{ env.PAGES_ARTIFACT_NAME }}
      - name: Verify exact public app release
        id: verify
        if: steps.deploy.outcome == 'success' || env.MODE == 'verify'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$MODE" = verify ]; then
            python3 scripts/release_verify.py verify --date '${{ steps.edition.outputs.date }}'
          else
            python3 scripts/release_verify.py verify --date '${{ steps.edition.outputs.date }}' --expected .site/release.json
          fi
      - name: Test alert path without publishing or spending API credits
        if: env.MODE == 'test-alert'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/release_verify.py test-alert --date '${{ steps.edition.outputs.date }}' --message 'TEST ONLY. The authorized publisher can create a GitHub notification incident. Receipt on a device must still be confirmed.'
      - name: Record one actionable incident if any required step failed
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          CHECK_DATE: ${{ steps.edition.outputs.date }}
          PROVIDER_OUTCOME: ${{ steps.provider_access.outcome }}
        run: |
          if [ "$PROVIDER_OUTCOME" = failure ]; then
            python3 - <<'PY'
          import os, sys
          from pathlib import Path
          sys.path[:0] = ['ops', 'scripts']
          from publisher_provider_check import failure_message
          from release_verify import incident
          d = os.environ['CHECK_DATE']
          incident(d, failure_message(Path.cwd(), d))
          PY
          else
            python3 scripts/release_verify.py alert --date "$CHECK_DATE"
          fi
      - name: Save resumable work even after failure
        if: always() && (env.MODE == 'publish' || env.MODE == 'recover')
        uses: actions/cache/save@v4
        with:
          path: .release-cache
          key: rural-release-v1-${{ steps.edition.outputs.date }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Preserve validation and delivery reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-reports-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 14
          if-no-files-found: ignore
          include-hidden-files: true
          path: |
            credential-check-report.json
            .release-cache/failure.json
            .release-cache/delivery-report.json
            .release-cache/*/api-responses.json
            .release-cache/*/attempts.json
            .release-cache/*/retained-discovery-continuation-used.json
            .release-cache/*/stage-responses/*.json
            .release-cache/*/audit.json
            .release-cache/*/validation-*.json
            .release-cache/*/diagnostic-summary.json
            .release-cache/*/typography-check.json
            .release-cache/*/source-evidence.json
            .release-cache/*/coverage-source-evidence.json
            .release-cache/*/coverage-plan-repair-authorized.json
            .release-cache/*/coverage-plan-repair-used*.json
            .release-cache/*/audit-bound.json
            .release-cache/*/editorial-loop-v1/*.json

